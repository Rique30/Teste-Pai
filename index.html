<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Controle de Serviços Aéreos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: lista de solicitações à esquerda, ficha da ordem à direita (Solicitação → Checklist → Nota fiscal). Empilha no celular. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14212C; --muted:#5B6B79; --line:#D5DCE3;
  --accent:#1D5AA6; --accent-ink:#FFFFFF; --amber:#B7790A; --amber-bg:#FBF1DC;
  --ok:#1E7A4C; --ok-bg:#E2F3EA; --paper:#FCFCFA;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#17212B; --ink:#E4EAF0; --muted:#93A3B2; --line:#2A3743;
  --accent:#6FA3E6; --accent-ink:#0B1520; --amber:#E2AE4A; --amber-bg:#33280F;
  --ok:#5CC48E; --ok-bg:#13301F; --paper:#1B2630; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#17212B; --ink:#E4EAF0; --muted:#93A3B2; --line:#2A3743;
  --accent:#6FA3E6; --accent-ink:#0B1520; --amber:#E2AE4A; --amber-bg:#33280F;
  --ok:#5CC48E; --ok-bg:#13301F; --paper:#1B2630; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:700 2.1rem/1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.btn{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);padding:8px 12px;border-radius:6px;margin-bottom:14px}

.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .code{font:600 1.15rem/1.1 var(--f-display);letter-spacing:.03em}
.item .meta{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.pill{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;align-self:start;white-space:nowrap}
.pill.pend{background:var(--amber-bg);color:var(--amber)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);font-size:.9rem}

.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h2{font:600 1.35rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 small{font:400 .8rem var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.saved{font-size:.85rem;color:var(--ok)}

.progress{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress>i{display:block;height:100%;background:var(--ok);transition:width .25s}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.checks .txt{flex:1;min-width:0}
.checks li.ok .txt{color:var(--muted)}
.checks .okmark{font:600 .75rem var(--f-mono);color:var(--ok);letter-spacing:.06em}
.addcheck{display:flex;gap:8px;margin-top:10px}
.keep{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted);cursor:pointer}
.keep input{width:16px;height:16px;accent-color:var(--accent)}

.nf{background:var(--paper);border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.nf-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px dashed var(--line)}
.nf-head b{font:700 1.2rem var(--f-display);letter-spacing:.06em}
.nf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.nf-grid{grid-template-columns:1fr}}
.nf-cell{padding:10px 14px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.nf-cell span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nf-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px;gap:10px;flex-wrap:wrap}
.nf-total strong{font:700 1.8rem var(--f-display);letter-spacing:.02em}
.nf-edit{margin-top:14px}

.tabs{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.tabs button{font:600 .9rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheet-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sheet-tools input,.sheet-tools select{width:auto;flex:1 1 200px;max-width:320px;background:var(--surface)}
.sheet-tools .count{color:var(--muted);font-size:.85rem;margin-left:auto}
.sheet-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.sheet{border-collapse:collapse;width:100%;min-width:1100px;font-size:.88rem;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
.sheet thead th{position:sticky;top:0;background:var(--bg);font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 8px;z-index:1}
.sheet thead tr.letters th{text-align:center;font-size:.68rem;color:var(--muted);padding:2px}
.sheet th.rn,.sheet td.rn{width:38px;text-align:center;background:var(--bg);color:var(--muted);font:500 .72rem var(--f-mono)}
.sheet td>input,.sheet td>textarea{border:0;border-radius:0;background:transparent;padding:7px 8px;width:100%;font-size:.88rem}
.sheet td>textarea{min-height:34px;height:34px;resize:vertical;display:block}
.sheet td>input:focus,.sheet td>textarea:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.sheet td.ro{padding:7px 8px;white-space:nowrap}
.sheet td.num input{text-align:right;font-family:var(--f-mono)}
.sheet tr.total td{background:var(--bg);font-weight:600;padding:8px}
.sheet tr.total td.num{text-align:right;font-family:var(--f-mono)}
.open{font:500 .78rem var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:7px 8px;text-decoration:underline}

.nf-serv{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font-size:.85rem}
@media (max-width:560px){.nf-serv{grid-template-columns:1fr}}
.nf-serv li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:3px 0}
.nf-serv li b{font-weight:500;color:var(--ok)}
.nf-serv li i{font-style:normal;color:var(--muted)}
.notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.nota-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.resumo{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.resumo div{display:flex;flex-direction:column}
.resumo span{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.resumo strong{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:4px}
.pick-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
@media (max-width:560px){.pick-list{grid-template-columns:1fr}}
.pick-list label{display:flex;align-items:center;gap:8px;font:400 .9rem var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer;padding:3px 0}
.pick-list input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.linkbtn{font:500 .8rem var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:20px;width:min(720px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog h2{font:600 1.4rem var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Controle de Serviços Aéreos</h1>
      <div class="sub">Ordens de serviço por aeroporto, com discriminação, checklist e nota fiscal.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnExcel" type="button">Gerar Excel</button>
      <button class="btn primary" id="btnNova" type="button">+ Nova solicitação</button>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabPlanilha" aria-selected="true">Planilha</button>
    <button type="button" role="tab" id="tabFichas" aria-selected="false">Fichas</button>
    <button type="button" role="tab" id="tabNotas" aria-selected="false">Nota Fiscal</button>
  </div>

  <section id="notasView" hidden>
    <div class="resumo" id="notasResumo"></div>
    <div class="sheet-tools">
      <input id="nfBusca" placeholder="Buscar por nota, OS, aeroporto ou serviço">
      <select id="nfFiltro"><option value="">Todas</option><option value="emitida">Emitidas</option><option value="sem">Sem nota</option><option value="avulsa">Avulsas (sem OS)</option></select>
      <button class="btn primary" id="btnNovaNf" type="button" style="margin-left:auto">+ Nova nota fiscal</button>
    </div>
    <div class="notas" id="notasList"></div>
  </section>

  <section id="sheetView">
    <div class="sheet-tools">
      <input id="fBusca" placeholder="Buscar por OS, aeroporto ou discriminação">
      <select id="fStatus"><option value="">Todos os status</option><option value="pend">Pendentes</option><option value="done">Concluídas</option></select>
      <span class="count" id="sheetCount"></span>
    </div>
    <div class="sheet-scroll"><table class="sheet" id="sheet"></table></div>
  </section>

  <div class="grid" id="fichasView" hidden>
    <nav class="list" id="list" aria-label="Solicitações"></nav>
    <main class="detail" id="detail"></main>
  </div>
</div>

<dialog id="dlgNova">
  <form id="formNova" method="dialog">
    <h2>Nova solicitação</h2>
    <div class="fields">
      <div class="field"><label for="nData">Data</label><input id="nData" type="date" required></div>
      <div class="field" style="grid-column:span 2"><label for="nAero">Aeroporto</label><input id="nAero" placeholder="SBGR · Guarulhos" required></div>
      <div class="field full"><label for="nObs">Discriminação</label><textarea id="nObs" placeholder="Descrição dos serviços a realizar"></textarea></div>
      <div class="field full">
        <label>Serviços solicitados (checklist)</label>
        <div class="pick">
          <div class="pick-head"><span class="sub" id="pickCount" style="margin:0"></span><button type="button" class="linkbtn" id="pickAll">Marcar todos</button></div>
          <div class="pick-list" id="pickList"></div>
        </div>
      </div>
      <div class="field"><label for="nNfNum">Nº da nota (opcional)</label><input id="nNfNum" class="mono"></div>
      <div class="field"><label for="nNfData">Data de emissão</label><input id="nNfData" type="date"></div>
      <div class="field"><label for="nNfValor">Valor (R$)</label><input id="nNfValor" class="mono" type="number" min="0" step="0.01"></div>
    </div>
    <div class="row-actions">
      <button class="btn" type="button" id="btnCancelar">Cancelar</button>
      <button class="btn primary" type="submit">Criar solicitação</button>
    </div>
  </form>
</dialog>

<dialog id="dlgNf">
  <form id="formNf" method="dialog">
    <h2 id="dlgNfTitulo">Nova nota fiscal</h2>
    <p class="sub" style="margin:-8px 0 14px">Nota avulsa, sem vínculo com uma solicitação de serviço.</p>
    <div class="fields">
      <div class="field"><label for="aNum">Nº da nota</label><input id="aNum" class="mono" required></div>
      <div class="field"><label for="aData">Data de emissão</label><input id="aData" type="date" required></div>
      <div class="field"><label for="aDataServ">Data do serviço</label><input id="aDataServ" type="date"></div>
      <div class="field" style="grid-column:span 2"><label for="aAero">Aeroporto</label><input id="aAero" placeholder="SBGR · Guarulhos"></div>
      <div class="field"><label for="aValor">Valor (R$)</label><input id="aValor" class="mono" type="number" min="0" step="0.01" required></div>
      <div class="field full"><label for="aObs">Discriminação</label><textarea id="aObs" placeholder="Descrição dos serviços cobrados"></textarea></div>
      <div class="field full">
        <label>Serviços da nota</label>
        <div class="pick">
          <div class="pick-head"><span class="sub" id="aPickCount" style="margin:0"></span><button type="button" class="linkbtn" id="aPickAll">Marcar todos</button></div>
          <div class="pick-list" id="aPickList"></div>
        </div>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" type="button" id="aCancelar">Cancelar</button>
      <button class="btn primary" type="submit" id="aSalvar">Criar nota fiscal</button>
    </div>
  </form>
</dialog>

<script>
const CHECK_PADRAO = [
  "Comissaria",
  "Transporte VIP",
  "Reabastecimento",
  "Atendimento VIP",
  "Hangar",
  "Taxa aeroportuária",
  "Locação",
  "Limpeza de QTU",
  "Manutenção",
  "Internet",
  "Suporte técnico",
  "Telefonia",
  "Banco de dados"
];
const EXEMPLOS = [
  {id:"ex1", exemplo:true, numero:"OS-0001", data:"2026-10-27", aeroporto:"SBGR · Guarulhos", hangar:"Hangar 3",
   obs:"Pernoite e limpeza completa. Cliente chega às 07h.", criado:1,
   checklist:CHECK_PADRAO.map(t=>({t,ok:true})), nf:{numero:"000.184", data:"2026-10-28", valor:4850}},
  {id:"ex2", exemplo:true, numero:"OS-0002", data:"2026-10-30", aeroporto:"SBSP · Congonhas", hangar:"Hangar 7B",
   obs:"Troca de pneu do trem principal esquerdo e reabastecimento.", criado:2,
   checklist:CHECK_PADRAO.map((t,i)=>({t,ok:i<4})), nf:{numero:"", data:"", valor:0}}
];

let db=null, canWrite=false, items=[], selId=null, live=false;
let notas=[{id:"nx1", exemplo:true, numero:"000.201", data:"2026-11-04", dataServ:"2026-11-04", aeroporto:"SBGR · Guarulhos",
  obs:"Locação de sala VIP para tripulação e serviço de internet.", servicos:["Locação","Internet"], valor:980, criado:1}];
let checkPadrao=[...CHECK_PADRAO], keepPadrao=true;
const $=s=>document.querySelector(s);
const brl=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const dataBR=d=>{ if(!d) return "—"; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done=it=>it.checklist.length>0 && it.checklist.every(c=>c.ok);

function notice(msg){ const n=$("#notice"); n.textContent=msg||""; n.hidden=!msg; }

function renderList(){
  const el=$("#list");
  if(!items.length){
    el.innerHTML=`<div class="empty">Nenhuma solicitação ainda. Toque em <b>+ Nova solicitação</b> para registrar a primeira, com data, aeroporto e discriminação.</div>`;
    return;
  }
  el.innerHTML=items.map(it=>{
    const n=it.checklist.filter(c=>c.ok).length;
    return `<button type="button" class="item" data-id="${esc(it.id)}" aria-current="${it.id===selId}">
      <span class="code">${esc(it.numero)}</span>
      <span class="pill ${done(it)?"done":"pend"}">${done(it)?"Concluída":`${n}/${it.checklist.length} ok`}</span>
      <span class="meta">${dataBR(it.data)} — ${esc(it.aeroporto)}${it.exemplo?" · exemplo":""}</span>
    </button>`;
  }).join("");
}

function nfDoc(n){
  return `<div class="nf">
      <div class="nf-head"><b>NFS-e Nº ${esc(n.numero||"—")}</b><span>${esc(n.ref)}</span></div>
      <div class="nf-grid">
        <div class="nf-cell"><span>Data de emissão</span>${dataBR(n.data)}</div>
        <div class="nf-cell"><span>Aeroporto</span>${esc(n.aeroporto||"—")}</div>
        <div class="nf-cell"><span>Data do serviço</span>${dataBR(n.dataServ)}</div>
      </div>
      <div class="nf-cell"><span>Discriminação dos serviços</span><div style="white-space:pre-wrap">${esc(n.obs||"—")}</div></div>
      <div class="nf-cell"><span>Serviços (${n.servicos.length})</span>
        ${n.servicos.length?`<ul class="nf-serv">${n.servicos.map(c=>`<li>${esc(c.t)}${c.ok===undefined?"":c.ok?"<b>OK</b>":"<i>pendente</i>"}</li>`).join("")}</ul>`:"—"}
      </div>
      <div class="nf-total"><span>VALOR TOTAL DO SERVIÇO</span><strong>${brl(n.valor)}</strong></div>
    </div>`;
}
function nfHtml(it){
  const nf=it.nf||{};
  return nfDoc({numero:nf.numero, ref:"Ref. "+it.numero, data:nf.data, aeroporto:it.aeroporto, dataServ:it.data, obs:it.obs, servicos:it.checklist, valor:nf.valor});
}
const avulsaDoc=a=>nfDoc({numero:a.numero, ref:"Avulsa", data:a.data, aeroporto:a.aeroporto, dataServ:a.dataServ, obs:a.obs, servicos:(a.servicos||[]).map(t=>({t})), valor:a.valor});

function renderDetail(){
  const el=$("#detail"); const it=items.find(i=>i.id===selId);
  if(!it){ el.innerHTML=`<section class="card"><h2>Selecione uma solicitação</h2><p class="sub">Os detalhes, o checklist e a nota fiscal aparecem aqui.</p></section>`; return; }
  const dis=canWrite?"":"disabled";

function renderNotas(){

  const rowsOs=f==="avulsa"?[]:items.filter(it=>(!f||(f==="emitida")===emitida(it)) && has([it.nf?.numero,it.numero,it.aeroporto,it.obs,...it.checklist.map(c=>c.t)]));
  const rowsAv=f==="sem"?[]:notas.filter(a=>has([a.numero,a.aeroporto,a.obs,...(a.servicos||[])]));
  const total=rowsOs.reduce((s,it)=>s+(Number(it.nf?.valor)||0),0)+rowsAv.reduce((s,a)=>s+(Number(a.valor)||0),0);
  $("#notasResumo").innerHTML=`<div><span>Notas de OS</span><strong>${items.filter(emitida).length}</strong></div>
    <div><span>Notas avulsas</span><strong>${notas.length}</strong></div>

    <div><span>Total ${q||f?"filtrado":"geral"}</span><strong>${brl(total)}</strong></div>`;
  const cards=[
    ...rowsAv.map(a=>({ord:a.data||"",html:`<article>${avulsaDoc(a)}
      <div class="nota-foot"><span class="pill done">Avulsa${a.exemplo?" · exemplo":""}</span>
      <span class="confirm" data-delwrap="${esc(a.id)}"><button type="button" class="open" data-edit-nf="${esc(a.id)}" ${dis}>Editar</button><button type="button" class="open" data-del-nf="${esc(a.id)}" ${dis}>Excluir</button></span></div></article>`})),
    ...rowsOs.map(it=>({ord:it.nf?.data||it.data||"",html:`<article>${nfHtml(it)}

      <button type="button" class="open" data-open="${esc(it.id)}">Abrir ficha</button></div></article>`}))

}

// --- gravação ---
let writing=Promise.resolve();
function save(it, patch){
  Object.assign(it, patch); render();
  if(!live) return Promise.resolve(true);
  const body={...it}; delete body.id;
  writing=writing.then(()=>db.collection("solicitacoes").doc(it.id).set(body)).then(()=>true).catch(e=>{
    if(e&&e.code==="invalid_argument"){ canWrite=false; notice("Você pode ver as solicitações, mas não tem permissão para alterá-las."); render(); }
    else if(e&&e.code==="quota_exceeded"){ notice("Limite de registros atingido. Exclua solicitações antigas para criar novas."); }
    else notice("Não foi possível salvar agora. Tente de novo em instantes.");
    return false;
  });
  return writing;
}

// --- Excel ---
let downloads=null;
function gerarPlanilha(){
  const linhas=items.map(it=>{
    const n=it.checklist.filter(c=>c.ok).length;
    return {
      "OS":it.numero, "Data":dataBR(it.data), "Aeroporto":it.aeroporto,
      "Discriminação":it.obs||"",
      "Checklist":`${n}/${it.checklist.length}`, "Status":done(it)?"Concluída":"Pendente",
      "Itens pendentes":it.checklist.filter(c=>!c.ok).map(c=>c.t).join("; "),
      "NF nº":it.nf?.numero||"", "Data NF":it.nf?.data?dataBR(it.nf.data):"", "Valor (R$)":Number(it.nf?.valor)||0
    };
  });
  const total=linhas.reduce((s,l)=>s+l["Valor (R$)"],0);
  linhas.push({"OS":"TOTAL","Valor (R$)":total});
  const ws=XLSX.utils.json_to_sheet(linhas);
  ws["!cols"]=[10,12,22,50,10,11,44,12,12,14].map(w=>({wch:w}));
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let r=1;r<=range.e.r;r++){ const c=ws[XLSX.utils.encode_cell({r,c:9})]; if(c) c.z='"R$" #,##0.00'; }
  const det=[];
  items.forEach(it=>it.checklist.forEach(c=>det.push({"OS":it.numero,"Aeroporto":it.aeroporto,"Item":c.t,"OK":c.ok?"Sim":"Não"})));
  const ws2=XLSX.utils.json_to_sheet(det.length?det:[{"OS":"","Aeroporto":"","Item":"","OK":""}]);
  ws2["!cols"]=[10,22,40,6].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Serviços");
  XLSX.utils.book_append_sheet(wb,ws2,"Checklist");
  const nfs=[
    ...items.filter(it=>it.nf?.numero).map(it=>({"NF nº":it.nf.numero,"Tipo":"OS "+it.numero,"Data emissão":dataBR(it.nf.data),"Aeroporto":it.aeroporto,"Discriminação":it.obs||"","Serviços":it.checklist.map(c=>c.t).join("; "),"Valor (R$)":Number(it.nf.valor)||0})),
    ...notas.map(a=>({"NF nº":a.numero,"Tipo":"Avulsa","Data emissão":dataBR(a.data),"Aeroporto":a.aeroporto||"","Discriminação":a.obs||"","Serviços":(a.servicos||[]).join("; "),"Valor (R$)":Number(a.valor)||0}))
  ];
  nfs.push({"NF nº":"TOTAL","Valor (R$)":nfs.reduce((s,l)=>s+l["Valor (R$)"],0)});
  const ws3=XLSX.utils.json_to_sheet(nfs);
  ws3["!cols"]=[12,12,12,22,44,44,14].map(w=>({wch:w}));
  const r3=XLSX.utils.decode_range(ws3["!ref"]);
  for(let r=1;r<=r3.e.r;r++){ const c=ws3[XLSX.utils.encode_cell({r,c:6})]; if(c) c.z='"R$" #,##0.00'; }
  XLSX.utils.book_append_sheet(wb,ws3,"Notas fiscais");
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}
$("#btnExcel").addEventListener("click",async()=>{
  if(!window.XLSX){ notice("O gerador de Excel não carregou. Recarregue a página."); return; }
  if(!items.length){ notice("Não há solicitações para exportar."); return; }
  const nome=`controle-servicos-aereos-${new Date().toISOString().slice(0,10)}.xlsx`;
  if(!window.claude){ XLSX.writeFile(XLSX.read(gerarPlanilha(),{type:"array"}),nome); return; }
  const dl=downloads||await window.claude.use("downloads").catch(()=>null);
  if(!dl){ notice("O download de arquivos não está disponível nesta visualização."); return; }
  downloads=dl;
  try{
    await dl.save({filename:nome, data:gerarPlanilha()});
    notice("");
  }catch(e){
    if(e?.code==="declined") return;
    notice(e?.code==="rate_limited"?"Já há um download aguardando confirmação.":"Não foi possível gerar o arquivo agora.");
  }
});

setView(view);

(async()=>{
  const [d,user]=await Promise.all([window.claude?.use("db"), window.claude?.use("user")].map(p=>Promise.resolve(p).catch(()=>null)));
  if(!d){ canWrite=true; notice("Modo de demonstração: as solicitações abaixo são exemplos e as alterações não são salvas."); return; }
  db=d; live=true;
  const perm=user ? await Promise.resolve(user.can("data.write")).catch(()=>null) : null;
  canWrite = perm!==false;
  if(!canWrite) notice("Você pode ver as solicitações, mas não tem permissão para alterá-las.");
  items=[]; notas=[]; selId=null; render();
  db.collection("notas").orderBy("criado","desc").onSnapshot(snap=>{
    notas=snap.docs.map(s=>({id:s.id,...structuredClone(s.data())}));
    renderNotas();
  },()=>{});
  db.doc("config/checklist").onSnapshot(s=>{
    const l=s.exists?s.data().itens:null;
    if(Array.isArray(l)&&l.length) checkPadrao=[...l];
  },()=>{});
  db.collection("solicitacoes").orderBy("criado","desc").onSnapshot(snap=>{
    items=snap.docs.map(s=>({id:s.id,...structuredClone(s.data())}));
    items.forEach(i=>{ i.checklist=i.checklist||[]; i.nf=i.nf||{}; });
    const keepEditing=document.activeElement && $("#detail").contains(document.activeElement) && items.some(i=>i.id===selId);
    if(!items.some(i=>i.id===selId)) selId=items[0]?.id||null;
    if(keepEditing) { renderList(); if(!sheetFocused()) renderSheet(); } else render();
  },()=>notice("A conexão com os dados foi interrompida. Recarregue a página."));
})();
</script>

</body>
</html>
